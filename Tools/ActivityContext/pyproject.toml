[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-context"
version = "0.1.0"
description = "Nara offline activity-context pipeline: WHOOP raw-IMU preprocessing, baseline classifier, HART adapter, serve/train/evaluate CLIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0 (see repo LICENSE); HART code MIT; WISDM data CC BY 4.0" }
dependencies = [
    # numpy<2 required by the pinned model stack (pyarrow 14 / datasets 2.14.4,
    # audit WS-07-F09): numpy 2.2.6 breaks pyarrow 14 at import time.
    "numpy==1.26.4",
]

[project.optional-dependencies]
model = [
    "torch==2.8.0",          # CPU wheel on macOS/linux default PyPI build; pinned per hart-repro report
    "transformers==4.56.0",
    "granite-tsfm==0.3.3",   # HART TSPulseForClassification adapter (imported lazily/optionally)
    "safetensors==0.8.0",
    # Reproducible HART env (audit WS-07-F09 / WS-03-F02): datasets 2.14.x uses
    # pa.PyExtensionType, removed in pyarrow>=16, so pyarrow MUST stay <16 and
    # numpy<2; this exact combo (datasets 2.14.4 + pyarrow 14.0.1 + numpy 1.26.4)
    # is the verified-working environment.
    "datasets==2.14.4",
    "pyarrow==14.0.1",
]
# ElderNet gait expert (activity_context.eldernet): six pinned upstream heads, CPU inference, numpy-only
# preprocessing. Weights AND the upstream source are University of Oxford Academic Use Licence material,
# fetched by sha256 by the operator (eldernet.weights / eldernet.upstream fetch) and never committed; use is
# limited to internal academic, non-commercial research (ELDERNET.md "Licence"). Off unless --gait-expert.
eldernet = [
    "torch==2.8.0",
]
dev = [
    "pytest>=8.0,<10",
]

[project.scripts]
activity-serve = "activity_context.serve:main"
activity-infer = "activity_context.infer:main"
activity-train = "activity_context.train:main"
activity-evaluate = "activity_context.evaluate:main"
activity-fetch = "activity_context.fetch_artifacts:main"
activity-eldernet-serve = "activity_context.eldernet.serve:main"

[tool.setuptools.packages.find]
include = ["activity_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
