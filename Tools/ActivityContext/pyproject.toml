[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-context"
version = "0.1.0"
description = "Nara offline activity-context pipeline: WHOOP raw-IMU preprocessing, baseline classifier, HART adapter, serve/train/evaluate CLIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0 (see repo LICENSE); HART code MIT; WISDM data CC BY 4.0" }
dependencies = [
    "numpy==2.2.6",
]

[project.optional-dependencies]
model = [
    "torch==2.8.0",          # CPU wheel on macOS/linux default PyPI build; pinned per hart-repro report
    "transformers==4.56.0",
    "granite-tsfm==0.3.3",   # HART TSPulseForClassification adapter (imported lazily/optionally)
    "safetensors==0.8.0",
]
dev = [
    "pytest>=8.0,<10",
]
# Inertia-1 motion heads (activity_context.inertia): encoder + preprocessing + serve.
inertia = [
    "torch==2.8.0",          # CPU fp32 inference of the vendored encoders
    "scipy==1.17.1",         # Butterworth/filtfilt + resample_poly (inertia-prep-1), erf GELU in heads
]
# ElderNet gait quality (activity_context.eldernet): six pinned upstream heads, CPU inference. numpy-only
# preprocessing (nearest-neighbour 30 Hz, upstream-identical), so no scipy/pandas/actipy at serve time.
# Weights AND the upstream source (models.py, gait_quality/*) are University of Oxford Academic Use Licence
# material, fetched by sha256 by the operator (eldernet.weights / eldernet.upstream fetch) and never committed;
# use is limited to internal academic, non-commercial research (ELDERNET.md "Licence").
eldernet = [
    "torch==2.8.0",
]
# Offline ElderNet run CLI (activity_context.eldernet.run): upstream gait_quality/quality.py needs pandas for the
# bout summaries. Never imported by the serve process.
eldernet-offline = [
    "torch==2.8.0",
    "pandas==3.0.6",
]
# Offline head training / evaluation (never needed by the serve process).
inertia-train = [
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
]

[project.scripts]
activity-serve = "activity_context.serve:main"
activity-infer = "activity_context.infer:main"
activity-train = "activity_context.train:main"
activity-evaluate = "activity_context.evaluate:main"
activity-fetch = "activity_context.fetch_artifacts:main"
activity-inertia-serve = "activity_context.inertia.serve:main"
activity-eldernet-serve = "activity_context.eldernet.serve:main"
activity-eldernet-run = "activity_context.eldernet.run:main"

[tool.setuptools.packages.find]
include = ["activity_context*"]

[tool.setuptools.package-data]
"activity_context.inertia" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
