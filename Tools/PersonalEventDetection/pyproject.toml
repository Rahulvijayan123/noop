[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nara-personal-events"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "scikit-learn==1.9.1", "joblib==1.6.0", "psycopg[binary]==3.2.9", "threadpoolctl==3.6.0"]

[project.optional-dependencies]
matrix = ["torch==2.14.0", "xgboost==3.4.1", "catboost==1.2.10", "pycatch22==0.5.0", "numba==0.67.0", "xlstm==2.0.6"]

[project.scripts]
nara-event-worker = "personal_events.worker:main"

[tool.setuptools.packages.find]
include = ["personal_events*"]
