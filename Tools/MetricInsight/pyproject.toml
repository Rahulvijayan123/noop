[project]
name = "nara-metric-insight"
version = "0.1.0"
description = "Nara metric insight worker: drains metric_insight_jobs, explains one metric with Prime Agent over owner-scoped tools, publishes validated explanations."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Proprietary" }
dependencies = [
    # PostgreSQL driver (binary wheel; no libpq build on the host).
    "psycopg[binary]==3.2.10",
]

[project.scripts]
nara-metric-insight = "nara_metric_insight.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nara_metric_insight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
markers = [
    "pg: needs a disposable local PostgreSQL built from the full migration chain (initdb in PATH or NARA_TEST_PG_BIN)",
    "prime: needs a prime-agent binary and its kernel Python (NARA_TEST_PRIME_BIN, NARA_TEST_KERNEL_PYTHON)",
]
