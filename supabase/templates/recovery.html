<!doctype html>
<html>
  <body style="font-family: -apple-system, Helvetica, Arial, sans-serif; color: #111; line-height: 1.5;">
    <h2 style="margin: 0 0 12px;">Reset your Nara password</h2>
    <p>Enter this code in the Nara app to choose a new password:</p>
    <p style="font-size: 32px; font-weight: 600; letter-spacing: 6px; margin: 20px 0;">{{ .Token }}</p>
    <p>The code expires in one hour and works once. If you didn't ask to reset your password, you can ignore this email; your password has not changed.</p>
  </body>
</html>
